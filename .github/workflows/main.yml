name: Build Pico USB I2S Speaker 32-Bit

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install compiler
      run: |
        sudo apt update
        sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

    # Переназначаем пины под RP2040-Zero и намертво врубаем режим 32-бит
    - name: Remap Pins and Force 32-Bit I2S
      run: |
        # 1. Меняем пины на наши удобные (2, 3, 4, 5)
        find . -name "*.h" -type f -exec sed -i 's/GPIO18/2/g' {} + || true
        find . -name "*.h" -type f -exec sed -i 's/GPIO20/3/g' {} + || true
        find . -name "*.h" -type f -exec sed -i 's/GPIO21/4/g' {} + || true
        find . -name "*.h" -type f -exec sed -i 's/GPIO22/5/g' {} + || true
        
        find . -name "*.h" -type f -exec sed -i 's/PICO_AUDIO_I2S_DATA_PIN.*/PICO_AUDIO_I2S_DATA_PIN (2)/g' {} + || true
        find . -name "*.h" -type f -exec sed -i 's/PICO_AUDIO_I2S_LROUT_PIN.*/PICO_AUDIO_I2S_LROUT_PIN (3)/g' {} + || true
        find . -name "*.h" -type f -exec sed -i 's/PICO_AUDIO_I2S_BCLK_PIN.*/PICO_AUDIO_I2S_BCLK_PIN (4)/g' {} + || true
        find . -name "*.h" -type f -exec sed -i 's/PICO_AUDIO_I2S_MCLK_PIN.*/PICO_AUDIO_I2S_MCLK_PIN (5)/g' {} + || true

        # 2. Хак для переключения TinyUSB в режим 32-бит
        find . -name "tusb_config.h" -type f -exec sed -i 's/CFG_TUD_AUDIO_FUNC_MIN_BITS_PER_SAMPLE.*/CFG_TUD_AUDIO_FUNC_MIN_BITS_PER_SAMPLE 32/g' {} + || true
        find . -name "tusb_config.h" -type f -exec sed -i 's/CFG_TUD_AUDIO_FUNC_MAX_BITS_PER_SAMPLE.*/CFG_TUD_AUDIO_FUNC_MAX_BITS_PER_SAMPLE 32/g' {} + || true
        find . -name "usb_descriptors.c" -type f -exec sed -i 's/0x10, 0x10/0x20, 0x20/g' {} + || true
        find . -name "usb_descriptors.c" -type f -exec sed -i 's/16, 16/32, 32/g' {} + || true
        
        # 3. Принудительно ставим стандартный формат I2S (Output mode = 0)
        find . -name "*.h" -type f -exec sed -i 's/#define OUTPUT_MODE.*/#define OUTPUT_MODE 0/g' {} + || true
        find . -name "*.c" -type f -exec sed -i 's/output_mode =.*/output_mode = 0;/g' {} + || true

    - name: Run CMake and Build
      run: |
        mkdir build
        cd build
        cmake -DPICO_SDK_FETCH_FROM_GIT=on ..
        make -j$(nproc)

    - name: Upload UF2 Firmware
      uses: actions/upload-artifact@v4
      with:
        name: rp2040-zero-i2s-firmware-32bit
        path: build/*.uf2
